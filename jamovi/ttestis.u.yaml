title: Independent Samples T-Test/Mann-Whitney U Test
name: ttestIS
jus: '3.0'
stage: 0
# compilerMode: aggressive
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Dependent Variables
        children:
          - type: VariablesListBox
            name: deps
            isTarget: true
      - type: TargetLayoutBox
        label: Grouping Variable
        children:
          - type: VariablesListBox
            name: group
            maxItemCount: 1
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: alternative
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: testType
  - type: LayoutBox
    margin: large
    style: inline
    children:
      - type: TextBox
        name: confLevel
        format: number
      - type: Label
        label: Confidence level = 1 - significance level
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: normalityTest
