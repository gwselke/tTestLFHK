title: One Sample T-Test/One Sample Wilcoxon Test
name: ttestOS
jus: '3.0'
stage: 0
# compilerMode: aggressive
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Variables
        children:
          - type: VariablesListBox
            name: xs
            isTarget: true
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: alternative
  - type: LayoutBox
    margin: large
    style: inline
    children:
      - type: TextBox
        name: mean
        format: number
      - type: Label
        label: Test value = hypothesized population mean (μ<sub>0</sub>)
  - type: LayoutBox
    margin: large
    children:
      - type: ComboBox
        name: testType
  - type: LayoutBox
    margin: large
    style: inline
    children:
      - type: TextBox
        name: confLevel
        format: number
      - type: Label
        label: Confidence level = 1 - significance level
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: normalityTest
